services:
  web:
    image: cr.yandex/\${registry_id}/\${repository_name}/web-app:latest
    env_file:
      - .env
    restart: on-failure
    networks:
      - app-network
  nginx:
    image: nginx:latest
    restart: on-failure
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ingress/nginx.conf:/etc/nginx/nginx.conf:rw
      - ./nginx/ingress/default.conf:/etc/nginx/conf.d/default.conf:rw
    depends_on:
      - web
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
